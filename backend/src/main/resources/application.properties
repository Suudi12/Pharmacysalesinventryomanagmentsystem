spring.application.name=PharmacySalesInventory

# --- Database (PostgreSQL) ---
# Update these to match your local/production database before running.
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy_sales_inventory
spring.datasource.username=pharmacy
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# app.jwt.secret must be at least 32 characters (256 bits) for HS256.
# Replace this with your own secret (e.g. via an environment variable) before deploying.
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-please-32chars-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
